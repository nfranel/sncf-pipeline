services:
  sncf-db:
    image: postgres:18
    container_name: sncf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"   #PC port is 5433 instead of 5432 as I already have a postgres running
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - sncf_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build: ./dbt
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      PG_HOST: sncf-db
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
      PG_DB: ${POSTGRES_DB}
    ports: 
      - "8080:8080"
    depends_on:
      sncf-db:
        condition: service_healthy
    networks:
      - sncf_net
    profiles: ["tools"]

volumes:
  pgdata:

networks:
  sncf_net:
    name: sncf_net