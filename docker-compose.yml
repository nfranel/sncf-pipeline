services:
  postgres:
    image: postgres:18
    container_name: sncf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"   #PC port is 5433 instead of 5432 as I already have a postgres running
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: